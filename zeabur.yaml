services:
  - name: i14-report-review
    type: python
    build:
      python_version: "3.13"
    run:
      command: streamlit run app.py --server.port=${PORT:-8080} --server.address=0.0.0.0 --server.headless=true --server.fileWatcherType=none --server.enableCORS=false --server.enableXsrfProtection=false --server.enableWebsocketCompression=false --browser.gatherUsageStats=false
      port: 8080
